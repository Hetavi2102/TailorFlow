<h1>Orders</h1>

<table border="1" cellpadding="8">
     <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Delivery Date</th>
        <th>Status</th>
        <th>Total Amount</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.order_id }}</td>
        <td>{{ order.full_name }}</td>
        <td>{{ order.delivery_date }}</td>
        <td>{{ order.current_status }}</td>
        <td>₹{{ order.total_amount }}</td>
    </tr>
    {% endfor %}
</table>

<a href="{{ url_for('payment', order_id=order.order_id) }}">
    <button>Payments</button>
</a>
